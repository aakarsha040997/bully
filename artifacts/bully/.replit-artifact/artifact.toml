kind = "mobile"
previewPath = "/"
title = "Bully"
version = "1.0.0"
id = "artifacts/bully"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 22808

[services.development]
run = "pnpm --filter @workspace/bully run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bully", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/bully", "run", "serve" ]

[services.env]
PORT = "22808"
BASE_PATH = "/"
