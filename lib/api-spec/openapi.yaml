openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: roast
    description: AI roast generation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /roast:
    post:
      operationId: generateRoast
      tags: [roast]
      summary: Generate an AI roast
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoastRequest"
      responses:
        "200":
          description: Generated roast
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoastResponse"
  /daily-report:
    post:
      operationId: generateDailyReport
      tags: [roast]
      summary: Generate a daily AI performance verdict
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DailyReportRequest"
      responses:
        "200":
          description: AI verdict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyReportResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    RoastRequest:
      type: object
      properties:
        roastLevel:
          type: integer
          minimum: 1
          maximum: 4
          description: "1=Friendly, 2=Sarcastic, 3=Savage, 4=Unhinged"
        activityType:
          type: string
          description: "e.g. Instagram, YouTube, Gaming, Missed Gym, etc."
        context:
          type: string
          description: "Additional context like duration or count"
      required:
        - roastLevel
        - activityType
        - context
    RoastResponse:
      type: object
      properties:
        roast:
          type: string
      required:
        - roast
    DailyReportRequest:
      type: object
      properties:
        screenTime:
          type: string
        topApp:
          type: string
        gymMissed:
          type: boolean
        waterGlasses:
          type: integer
        readingMinutes:
          type: integer
        shortsWatched:
          type: integer
        productivityScore:
          type: integer
      required:
        - screenTime
        - topApp
        - gymMissed
        - waterGlasses
        - readingMinutes
        - shortsWatched
        - productivityScore
    DailyReportResponse:
      type: object
      properties:
        verdict:
          type: string
      required:
        - verdict
